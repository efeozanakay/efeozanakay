    <path d="M808 57 A92 92 0 0 1 893 115" fill="none" stroke="#72f2ce" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="808" cy="57" r="5" fill="#72f2ce"/>
    <circle cx="885" cy="199" r="3" fill="#a69eff"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 808 149" to="-360 808 149" dur="30s" repeatCount="indefinite"/>
    <path d="M808 80 A69 69 0 0 0 748 115" fill="none" stroke="#a29aff" stroke-width="3" stroke-linecap="round"/>
    <circle cx="808" cy="80" r="3" fill="#a29aff"/>
  </g>
  <path d="M808 110V188M769 149H847" stroke="#a3ffe6" stroke-opacity=".3"/>
  <rect x="785" y="126" width="46" height="46" rx="11" fill="#132d3a" stroke="#73f0cf" stroke-opacity=".7" stroke-width="1.4"/>
  <path d="M797 148L805 157L820 141" stroke="#8bffdb" fill="none" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="808" cy="149" r="31" fill="none" stroke="#78f7d4" stroke-opacity=".1">
    <animate attributeName="r" values="25;42;25" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values=".25;0;.25" dur="4s" repeatCount="indefinite"/>
  </circle>
  <g font-family="monospace" font-size="10" letter-spacing="1.6">
    <text x="678" y="35" fill="#849ab3">SYS / 001</text>
    <text x="857" y="263" fill="#78f7d4">ACTIVE</text>
    <circle cx="842" cy="258" r="3" fill="#78f7d4">
      <animate attributeName="opacity" values=".3;1;.3" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>
  <path d="M0 292H1000" stroke="#78f7d4" stroke-opacity=".3"/>
  <rect x="0" y="291" width="150" height="2" rx="1" fill="#78f7d4" opacity=".9">
