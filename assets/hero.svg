<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
<title id="title">Efe Ozan Akay — Code, AI, Design, Film and Sound</title>
<desc id="desc">Japanese-inspired nocturnal editorial banner, animated vermilion sun, rotating technical markings, subtle scan line and glowing accents.</desc>
<defs>
  <linearGradient id="night" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#090B10"/><stop offset="65%" stop-color="#12131A"/><stop offset="100%" stop-color="#21191D"/></linearGradient>
  <linearGradient id="sun" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#F17B56"/><stop offset="75%" stop-color="#C83B31"/><stop offset="100%" stop-color="#942A2B"/></linearGradient>
  <linearGradient id="trace" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#D95A42" stop-opacity="0"/><stop offset="45%" stop-color="#D95A42" stop-opacity=".85"/><stop offset="100%" stop-color="#D95A42" stop-opacity="0"/></linearGradient>
  <pattern id="mesh" width="39" height="39" patternUnits="userSpaceOnUse"><path d="M39 0H0V39" fill="none" stroke="#C9C5BA" stroke-opacity=".045" stroke-width="1"/></pattern>
  <clipPath id="boundary"><rect width="1200" height="380" rx="12"/></clipPath>
  <clipPath id="sunmask"><circle cx="984" cy="181" r="116"/></clipPath>
  <filter id="glow"><feGaussianBlur stdDeviation="18"/></filter>
</defs>
<g clip-path="url(#boundary)">
  <rect width="1200" height="380" fill="url(#night)"/>
  <rect width="1200" height="380" fill="url(#mesh)"/>
  <path d="M0 59H1200M0 325H1200" stroke="#DCD7CD" stroke-opacity=".12"/>
  <path d="M50 0V380M1150 0V380" stroke="#DCD7CD" stroke-opacity=".09"/>
  <path d="M68 43H155" stroke="#E56447" stroke-width="2"/>
  <rect x="68" y="62" width="30" height="28" rx="1" fill="#CE4C37"/>
  <text x="74" y="81" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#FBF0E4">EA</text>
  <text x="111" y="80" font-family="monospace" font-size="13" letter-spacing="2" fill="#B9B4AE">INDEPENDENT / INTERDISCIPLINARY</text>
  <text x="68" y="176" font-family="Arial, Helvetica, sans-serif" font-size="72" letter-spacing="-2" font-weight="800" fill="#F3EEE5">EFE OZAN</text>
  <text x="68" y="248" font-family="Arial, Helvetica, sans-serif" font-size="72" letter-spacing="-2" font-weight="800" fill="#F3EEE5">AKAY<tspan fill="#D85A43">.</tspan></text>
  <text x="71" y="286" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600" letter-spacing="2" fill="#E46C52">CODE / AI / DESIGN / FILM / SOUND</text>
  <text x="70" y="309" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#AFAAA4">From concept to craft. From experiments to experiences.</text>
  <text x="70" y="354" font-family="monospace" font-size="12" letter-spacing="2" fill="#A5A09C">ANTALYA · TR</text>
  <text x="354" y="354" font-family="monospace" font-size="12" letter-spacing="1.6" fill="#A5A09C">CREATE / EXPLORE / EVOLVE</text>
  <path d="M715 50V323" stroke="#F3EEE5" stroke-opacity=".11"/>
  <text x="744" y="80" font-family="monospace" font-size="11" letter-spacing="2" fill="#9B9AA0">STUDY NO. 001</text>
  <text x="744" y="99" font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, sans-serif" font-size="12" letter-spacing="3" fill="#E9E1D3">構想から形へ</text>
  <circle cx="984" cy="181" r="141" fill="none" stroke="#D85A43" stroke-opacity=".26" stroke-dasharray="2 9">
    <animateTransform attributeName="transform" type="rotate" from="0 984 181" to="360 984 181" dur="70s" repeatCount="indefinite"/>
  </circle>
  <circle cx="984" cy="181" r="122" fill="none" stroke="#F3EEE5" stroke-opacity=".13" stroke-width="1"/>
  <circle cx="984" cy="181" r="119" fill="#E56045" opacity=".17" filter="url(#glow)"/>
  <circle cx="984" cy="181" r="116" fill="url(#sun)">
    <animate attributeName="opacity" values=".97;.78;.97" dur="7s" repeatCount="indefinite"/>
  </circle>
  <g clip-path="url(#sunmask)">
