    <path d="M855 300L891 273L934 292L969 254L1012 288L1052 266L1118 293V327H853Z" fill="#0E1017" fill-opacity=".82"/>
  </g>
  <circle cx="984" cy="181" r="151" fill="none" stroke="#D85A43" stroke-opacity=".65" stroke-width="2" stroke-dasharray="47 900">
    <animateTransform attributeName="transform" type="rotate" from="0 984 181" to="-360 984 181" dur="28s" repeatCount="indefinite"/>
  </circle>
  <path d="M794 182H829M1139 182H1170" stroke="#D85A43" stroke-opacity=".7" stroke-width="1.2"/>
  <path d="M984 16V43M984 321V343" stroke="#D85A43" stroke-opacity=".7" stroke-width="1.2"/>
  <text x="744" y="306" font-family="Noto Sans CJK JP, Yu Gothic, Hiragino Kaku Gothic ProN, sans-serif" font-size="13" letter-spacing="2" fill="#D8CFC3">創造  ·  技術  ·  探究</text>
  <circle cx="1135" cy="69" r="3.5" fill="#DC5A44"><animate attributeName="opacity" values=".3;1;.3" dur="2.9s" repeatCount="indefinite"/></circle>
  <text x="1073" y="51" font-family="monospace" font-size="10" letter-spacing="1.4" fill="#A4A0A0">LIVE / 26</text>
  <rect x="-210" y="375" width="210" height="3" fill="url(#trace)">
    <animate attributeName="x" values="-210;1200" dur="11s" repeatCount="indefinite"/>
  </rect>
  <path d="M50 0H1200" stroke="#E56447" stroke-opacity=".22"/>
  <rect x="1" y="1" width="1198" height="378" rx="11" fill="none" stroke="#B9A9A0" stroke-opacity=".19"/>
</g>
